services:
  face-recognition:
    build: .
    image: face-recognition:latest
    container_name: face-recognition
    entrypoint: ["python", "-u", "-m", "face_recognition"]
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - model_cache:/root/.insightface
      - gallery_data:/root/.face_recognition
      - ./workspace:/workspace
    devices:
      - /dev/video0
      - /dev/video1
      - /dev/video2
      - /dev/video3
      - /dev/video4
      - /dev/video5
      - /dev/video6
      - /dev/video7
      - /dev/video8
      - /dev/video9
    stdin_open: true
    tty: true

volumes:
  model_cache:
  gallery_data:
