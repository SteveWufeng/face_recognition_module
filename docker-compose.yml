services:
  face-recognition:
    build: .
    image: face-recognition:latest
    container_name: face-recognition-1
    network_mode: host
    environment:
      - PYTHONPATH=/app
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - QT_QPA_PLATFORM=offscreen
    volumes:
      - .:/app
      - ./.insightface:/root/.insightface
      - ./.face_recognition:/root/.face_recognition
    restart: unless-stopped
